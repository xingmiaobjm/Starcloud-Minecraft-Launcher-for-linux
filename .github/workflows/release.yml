name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的已有标签 (例如 v0.3.8-beta.8)'
        required: true
      dry_run:
        description: '只构建，不上传 Release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install system dependencies for fpm/deb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby \
            ruby-dev \
            build-essential \
            rpm \
            libarchive-tools \
            zlib1g-dev

      - name: Install npm dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Fetch C# bridge
        run: bash ./scripts/fetch-bridge.sh --from-https
        env:
          STARCLOUD_CLONE: "1"

      - name: Build AppImage + deb
        run: npm run package --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Locate build artifacts
        id: artifacts
        run: |
          APPIMAGE=$(ls release/*.AppImage | head -n1)
          DEB=$(ls release/*.deb | head -n1)
          echo "appimage=${APPIMAGE}" >> $GITHUB_OUTPUT
          echo "deb=${DEB}" >> $GITHUB_OUTPUT
          echo "appimage_name=$(basename ${APPIMAGE})" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename ${DEB})" >> $GITHUB_OUTPUT

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.deb }}
          retention-days: 7

      - name: Upload to Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.deb }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') || contains(github.event.inputs.tag || github.ref_name, 'alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}